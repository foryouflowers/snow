<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snow Globe</title>
<style>
  html,body { margin:0; height:100%; background:#000; overflow:hidden; font-family:system-ui,sans-serif; }
  body { display:flex; align-items:center; justify-content:center; }
  .win { position:relative; width:min(100vw, calc((100vh - 32px) * 1.236)); background:#000; }
  .title { display:flex; align-items:center; gap:8px; height:32px; padding:0 12px; background:#d9eef3; color:#333; font-size:12px; }
  .title i { width:12px; height:12px; border-radius:3px; background:#f2b01e; display:inline-block; }
  canvas { display:block; width:100%; height:auto; background:#000; filter:contrast(1.1) saturate(1.2); }
  .win::after { content:''; position:absolute; left:0; right:0; bottom:0; top:32px; pointer-events:none;
    background:radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,.65) 100%), repeating-linear-gradient(0deg, rgba(0,0,0,.14) 0 1px, transparent 1px 3px); }
  body { cursor:crosshair; }
  #hint { position:absolute; left:0; right:0; bottom:10px; text-align:center; color:#ffffff99; font-size:12px;
    letter-spacing:.08em; pointer-events:none; transition:opacity 1s; animation:pulse 2.4s ease-in-out infinite; }
  #intro { position:absolute; inset:0; z-index:5; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:34px;
    background:radial-gradient(ellipse at 50% 45%, #2a0a18 0%, #0a0208 70%, #000 100%); transition:opacity 1.1s ease; }
  #intro.gone { opacity:0; pointer-events:none; }
  #intro h1 { margin:0; font:italic 400 clamp(30px, 7vw, 64px) Georgia, 'Times New Roman', serif; color:#ffd9e4; letter-spacing:.08em;
    text-shadow:0 0 24px rgba(255,80,130,.55); opacity:0; animation:rise 2.2s ease .4s forwards; }
  #intro h1 span { display:inline-block; animation:beat 1.3s ease-in-out infinite; }
  #press { font:inherit; font-size:clamp(14px, 2.6vw, 19px); letter-spacing:.06em; color:#fff; background:linear-gradient(135deg,#ff4d7d,#c2185b);
    border:0; border-radius:999px; padding:14px 30px; cursor:pointer; opacity:0; box-shadow:0 0 28px rgba(255,70,120,.55);
    animation:rise 1.6s ease 2.8s forwards, glow 1.8s ease-in-out 4.4s infinite; }
  #press:hover { transform:scale(1.05); }
  @keyframes rise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
  @keyframes beat { 50% { transform:scale(1.25); } }
  @keyframes glow { 50% { box-shadow:0 0 46px rgba(255,70,120,.9); } }
  @keyframes pulse { 50% { opacity:.35; } }
</style>
</head>
<body>
<div class="win">
  <div class="title"><i></i>Snow Globe</div>
  <canvas id="out"></canvas>
  <div id="hint" style="display:none"></div>
  <div id="intro">
    <h1>FOR YOU... <span>❤️</span></h1>
    <button id="press">please press the button ❤️</button>
  </div>
</div>

  ctx.fillStyle = '#5a3205'; ctx.fillRect(-8, -27, 16, 1.5);
  ctx.fillStyle = '#ffe08a'; for (let i = 0; i < 3; i++) ctx.fillRect(-.5, -24 + i*4, 1, 1);
  ctx.strokeStyle = 'rgba(70,35,0,.3)'; ctx.lineWidth = .5; for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(i*2.4, -26); ctx.lineTo(i*3.3, -12.5); ctx.stroke(); }
  ctx.fillStyle = hg(-7, 7, ['#1b3aa8', '#4a7cff', '#2a58d8', '#162f8a']); ctx.beginPath(); ctx.ellipse(0, -42, 7, 3, 0, 0, 6.2832); ctx.fill(); ctx.fillRect(1.5, -42, 3.4, 9);
  face(0, -47.6, 4.5, back ? ['#cf9a5c', '#9a6632'] : ['#f0b88c', '#b87848'], back);
  ctx.fillStyle = hg(-6, 6, ['#16308a', '#4a7cff', '#2a52c8', '#14287a']); ctx.beginPath(); ctx.arc(0, -49, 5.6, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#1c3cae'; ctx.fillRect(-6.2, -50, 12.4, 2.2);
  ctx.strokeStyle = 'rgba(10,20,80,.4)'; ctx.lineWidth = .4; for (let i = -4; i <= 4; i += 2) { ctx.beginPath(); ctx.moveTo(i, -50); ctx.lineTo(i*.7, -54.4); ctx.stroke(); }
  circle(0, -55, 1.5, '#6f98ff');
  ctx.restore();
}
function woman(x, y, sx, bob, tilt, hem, flow, back) {
  ctx.save(); ctx.translate(x, y + bob); ctx.rotate(tilt); ctx.scale(sx, 1);
  ctx.fillStyle = hg(-6, 6, ['#5a3414', '#b07a30', '#6a3e16']); ctx.beginPath(); ctx.ellipse(0, -39, 5.8, 8, 0, 0, 6.2832); ctx.fill();
  ctx.fillStyle = '#6a3a22'; ctx.fillRect(-3.6, -10, 2.6, 6); ctx.fillRect(1, -10, 2.6, 6);
  ctx.fillStyle = hg(-5, 5, ['#2a140a', '#7a4526', '#3a1c0c']); ctx.fillRect(-4.8, -5, 3.9, 5); ctx.fillRect(.9, -5, 3.9, 5);
  ctx.fillStyle = hg(-hem, hem, ['#2f6ea6', '#9ad8ff', '#6cb4e6', '#2c68a0']);
  ctx.beginPath(); ctx.moveTo(-3.6, -34); ctx.lineTo(3.6, -34); ctx.quadraticCurveTo(5.5, -18, hem, -8);
  for (let i = 0; i < 6; i++) ctx.quadraticCurveTo(hem - (i + .5)*hem/3, -6.2, hem - (i + 1)*hem/3, -8);
  ctx.quadraticCurveTo(-5.5, -18, -3.6, -34); ctx.fill();
  ctx.strokeStyle = 'rgba(20,60,110,.32)'; ctx.lineWidth = .55; for (let i = -3; i <= 3; i++) { ctx.beginPath(); ctx.moveTo(i*1.1, -30); ctx.lineTo(i*hem/3.4, -8.5); ctx.stroke(); }
  ctx.fillStyle = '#1f4f86'; ctx.fillRect(-3.8, -30.5, 7.6, 1.5); ctx.fillStyle = '#f4f8ff'; ctx.fillRect(-3.8, -35, 7.6, 1.6);
  face(0, -42, 4.2, back ? ['#e2ac52', '#b07c2e'] : ['#ffd0aa', '#d0906a'], back);
  ctx.fillStyle = hg(-5.5, 5.5, ['#8a1414', '#ff4a40', '#d62828', '#7a1010']); ctx.beginPath(); ctx.arc(0, -44, 5.2, Math.PI, 0); ctx.fill(); ctx.fillRect(-5.6, -45, 11.2, 2);
  ctx.beginPath(); ctx.moveTo(1, -48.5); ctx.quadraticCurveTo(10 + flow*.3, -52, 16 + flow, -45 + flow*.5); ctx.quadraticCurveTo(10, -46, 4, -44); ctx.fill();
  circle(16 + flow, -45 + flow*.5, 1.5, '#ff8a80');
  ctx.restore();
}

// ---------- snow globe parts ----------
function drawTree(a) {
  ctx.globalAlpha = a;
  for (let i = 0; i < 4; i++) {
    const top = 62 + i*11, hw = 8 + i*5;
    poly([[128, top], [128 + hw, top + 18], [128 - hw, top + 18]], i % 2 ? '#3f9a62' : '#4aab70');
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    ctx.fillRect(128 - hw*.5, top + 12, 3, 1.1); ctx.fillRect(128 + hw*.2, top + 15, 3.4, 1.1);
  }
  ctx.fillStyle = '#6b4a2b'; ctx.fillRect(126.5, 108, 3, 7);
  ctx.globalAlpha = 1;
}
function drawBase(a) {
  ctx.globalAlpha = a;
  ctx.fillStyle = '#a85a28'; ctx.beginPath(); ctx.ellipse(50, 131, 86, 10, 0, 0, 6.2832); ctx.fill();   // plate
  ctx.fillStyle = '#b8864f'; ctx.fillRect(-4, 106, 108, 22);                                          // cake body
  ctx.beginPath(); ctx.ellipse(50, 128, 54, 6, 0, 0, 3.1416); ctx.fill();
  ctx.fillStyle = 'rgba(110,60,25,.55)'; for (let i = 0; i < 22; i++) ctx.fillRect(-1 + i*5, 112, 1.5, 14);
  ctx.fillStyle = '#e8cfa0'; ctx.beginPath(); ctx.ellipse(50, 106, 54, 6, 0, 0, 6.2832); ctx.fill();   // frosting top
  ctx.fillStyle = '#f6ecd6'; for (let i = 0; i < 12; i++) ctx.fillRect(4 + i*8.4, 106, 4, 5 + (i%3)*2); // drips
  circle(24, 121, 3, '#f2f2f2'); circle(32, 121, 3, '#d62828');                                      // tiny figures on the plate
  ctx.fillStyle = '#2f55c8'; ctx.fillRect(22, 124, 4, 4); ctx.fillStyle = '#e3a31f'; ctx.fillRect(30, 124, 4, 4);
  ctx.globalAlpha = 1;
}

// ---------- frame ----------
function renderScene(u, time) {
  // camera
  // drone shot: starts high above the globe, descends toward the couple, drifts, then climbs back up
  const tm = u*dur; let k;
  if (tm < 4.9) k = ez((tm - .4)/4.5); else if (tm < 12.2) k = 1; else if (tm < 14) k = 1 - ez((tm - 12.2)/1.8); else k = 0;
  const z = lerp(.42, .95, k)*(1 + .03*Math.sin(time*.4)*k);
  const cx = lerp(50, 44, k) + Math.sin(time*.3)*2*k + px*4, cy = lerp(57, 38, k) + Math.sin(time*.5)*1.2*k + py*2;

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, scene.width, scene.height);
  ctx.setTransform(4.4, 0, 0, 2.2, 0, 0);
  ctx.translate(50, 40.5); ctx.scale(z, z); ctx.translate(-cx, -cy);

  const outer = 1 - ez((z - .55)/.15);                // globe, base, tree fade as we zoom in
  if (outer > 0) { drawTree(outer); drawBase(outer); }

  ctx.save();
  ctx.beginPath(); ctx.arc(GX, GY, lerp(GR, 260, 1 - outer), 0, 6.2832); ctx.clip();

  // sky: stars, moon, distant pines (slower parallax = depth)
  for (let i = 0; i < 130; i++) { const sx = (i*37.3)%190 - 45, sy = (i*17.9)%70 - 30; ctx.fillStyle = `rgba(200,220,255,${.25 + .35*Math.sin(time*1.5 + i)**2})`; ctx.fillRect(sx - (cx - 50)*.08, sy, .8, .7); }
  const mg = ctx.createRadialGradient(84 - (cx - 50)*.12, 14, 0, 84 - (cx - 50)*.12, 14, 20);
  mg.addColorStop(0, 'rgba(190,215,255,.55)'); mg.addColorStop(.25, 'rgba(120,160,230,.18)'); mg.addColorStop(1, 'rgba(120,160,230,0)');
  ctx.fillStyle = mg; ctx.fillRect(55, -10, 60, 50); circle(84 - (cx - 50)*.12, 14, 3.6, '#e8f0ff');
  for (let i = 0; i < 28; i++) { const tx = -60 + i*8.6 - (cx - 50)*.25, th = 14 + (i*7)%9;
    poly([[tx, 62], [tx + 4.5, 62 - th], [tx + 9, 62]], i % 2 ? '#183a58' : '#1d4466'); }
  // ground
  const gg = ctx.createLinearGradient(0, 62, 0, 108);
  gg.addColorStop(0, '#ffffff'); gg.addColorStop(1, '#7d8fb2');
  ctx.fillStyle = gg; ctx.beginPath(); ctx.ellipse(50, 122, 200, 60, 0, 0, 6.2832); ctx.fill();
  for (const s of speck) { ctx.fillStyle = (s.l > .86 && Math.sin(time*4 + s.x*3) > .75) ? '#fff' : `rgba(${40 + s.l*50|0},${50 + s.l*50|0},${70 + s.l*60|0},${s.a})`; ctx.fillRect(s.x, s.y, s.w, s.h); }

  // lamp
  const flick = .86 + Math.sin(time*7)*.06 + Math.sin(time*3.3)*.05 + energy*.6;
  const gl = ctx.createRadialGradient(20, 22, 0, 20, 22, 26);
  gl.addColorStop(0, `rgba(255,205,70,${.32*flick})`); gl.addColorStop(1, 'rgba(255,205,70,0)');
  ctx.fillStyle = gl; ctx.fillRect(-12, -10, 64, 70);
  ctx.fillStyle = '#4c4c55'; ctx.fillRect(19.2, 27, 1.6, 37);
  ctx.fillStyle = '#777784'; ctx.fillRect(19.2, 27, .6, 37);
  ctx.fillStyle = '#3a3a42'; ctx.fillRect(17.5, 62, 5, 2);
  ctx.fillStyle = '#7a5a10'; ctx.fillRect(15, 12.5, 10, 1.8); ctx.fillRect(15, 26, 10, 1.8);
  ctx.fillStyle = '#f2b01e'; ctx.fillRect(15.6, 14, 8.8, 12);
  ctx.fillStyle = `rgba(255,236,150,${.95*flick})`; ctx.fillRect(17.4, 15.6, 5.2, 8.6);
  ctx.fillStyle = '#8a6410'; ctx.fillRect(19.7, 14, .6, 12);

  // dancing couple
  const a = time*1.15, bx = 60 + Math.sin(time*.5)*3, gy = 64, R = 7.5, c = Math.cos(a), sn = Math.sin(a);
  const bob = -Math.abs(Math.sin(a*2))*1.4, tilt = Math.sin(a)*.05;
  const hem = 14 + Math.sin(a*2)*3, flow = Math.sin(time*3)*2.2 + 2;
  ctx.fillStyle = 'rgba(40,50,80,.4)'; ctx.beginPath(); ctx.ellipse(bx, gy + 1, 19, 2.6, 0, 0, 6.2832); ctx.fill();
  const mx = bx - R*c, wx = bx + R*c + 1;
  const sM = .92*(.72 + .28*Math.abs(sn)), sW = .95*(.72 + .28*Math.abs(sn));
  if (sn > 0) { woman(wx, gy, sW, bob, tilt, hem, flow, false); man(mx, gy, sM, bob, -tilt, true); }   // man is nearer: we see his back
  else { man(mx, gy, sM, bob, -tilt, false); woman(wx, gy, sW, bob, tilt, hem, flow, true); }
  // arms + mittens
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#d4951a'; ctx.lineWidth = 3.2;
  ctx.beginPath(); ctx.moveTo(mx + 3, gy + bob - 36); ctx.lineTo(wx - 1, gy + bob - 31); ctx.stroke();
  ctx.strokeStyle = '#5aa2d8'; ctx.lineWidth = 2.6;
  ctx.beginPath(); ctx.moveTo(wx - 2, gy + bob - 33); ctx.lineTo(mx + 4, gy + bob - 37); ctx.stroke();
  circle(wx - 1, gy + bob - 31, 1.7, '#d62828'); circle(mx + 4, gy + bob - 37, 1.6, '#d62828');

  // snow (more turbulence right after the globe is "shaken")
  const turb = lerp(6, 1, ez(u/.4));
  for (const f of flakes) {
    f.y += f.v*.033*(1 + energy*1.5); f.x += (Math.sin(time*1.4 + f.p)*.35 + Math.sin(time*.9 + f.y*.2)*.25*turb*.3)*.7 + .05;
    if (f.y > 72) { f.y = -40; f.x = -40 + Math.random()*180; }
    if (f.x > 140) f.x = -40;
    ctx.globalAlpha = f.a*(.7 + .3*Math.sin(time*2 + f.p))*(f.s > 1.9 ? .4 : 1);
    ctx.fillStyle = Math.hypot(f.x - 20, f.y - 21) < 22 ? '#ffe7a0' : '#fff'; ctx.fillRect(f.x, f.y, f.s, f.s*.85);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // glass
  if (outer > 0) {
    ctx.globalAlpha = outer*.8;
    ctx.strokeStyle = '#aab6c6'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(GX, GY, GR, 0, 6.2832); ctx.stroke();
    ctx.strokeStyle = '#eef4ff'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(GX, GY, GR - 3.5, 3.55, 4.55); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // fade in/out at the loop edges
  const fade = u < .03 ? 1 - u/.03 : u > .97 ? (u - .97)/.03 : 0;
  if (fade > 0) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, scene.width, scene.height); }
}

function toAscii() {
  sg.drawImage(scene, 0, 0, COLS, ROWS);
  const d = sg.getImageData(0, 0, COLS, ROWS).data;
  og.fillStyle = '#000'; og.fillRect(0, 0, out.width, out.height);
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const i = (y*COLS + x)*4, r = d[i], g = d[i+1], b = d[i+2];
      const mx = Math.max(r, g, b);
      if (mx < 22) continue;
      let lum = clamp((mx/255 - .06)/.9, 0, 1); lum = Math.pow(lum, .78);
      const k = clamp(Math.floor(lum*16 + ((x&1)*2 + (y&1) - 1.5)*.22), 0, 15);
      if (k === 0) continue;
      const s = 255/mx, dim = .5 + .5*(k/15);
      og.fillStyle = `rgb(${Math.min(255, r*s*dim)|0},${Math.min(255, g*s*dim)|0},${Math.min(255, b*s*dim)|0})`;
      og.fillText(RAMP[k], x*CW, y*CH);
    }
  }
}

// ---------- song (Web Audio: no buttons; starts on the first tap/click/key) ----------
let an = null, fd = null, energy = 0, px = 0, py = 0, tpx = 0, tpy = 0;
let ac = null, gain = null, abuf = null, src = null, t0 = 0, dur = 14.6, playing = false;
const START = .4; let pressT = 0, started = false, starting = false;
const hint = document.getElementById('hint');
(async function prepAudio() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    ac = new AC(); gain = ac.createGain(); gain.connect(ac.destination);
    an = ac.createAnalyser(); an.fftSize = 256; fd = new Uint8Array(an.frequencyBinCount); gain.connect(an);
    const bin = atob(AUDIO_B64), arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    abuf = await new Promise((res, rej) => ac.decodeAudioData(arr.buffer, res, rej));
    dur = abuf.duration;
  } catch (e) { hint.textContent = ''; }
})();
function tryStart() {
  if (playing || starting || !abuf) return;
  starting = true;
  ac.resume().then(() => {
    starting = false;
    if (ac.state !== 'running' || playing) return;
    playing = true;
    src = ac.createBufferSource(); src.buffer = abuf; src.loop = true; src.connect(gain);
    src.start(0, ((performance.now() - pressT)/1000 + START) % dur);
    hint.style.opacity = 0;
  }).catch(() => { starting = false; });
}
window.addEventListener('pointermove', e => { tpx = e.clientX/innerWidth*2 - 1; tpy = e.clientY/innerHeight*2 - 1; });
document.getElementById('press').addEventListener('click', () => { if (!started) { started = true; pressT = performance.now(); } if (ac) ac.resume(); tryStart(); document.getElementById('intro').classList.add('gone'); });

// ---------- main loop ----------
const tStart = performance.now();
let lastDraw = 0;
function loop(now) {
  requestAnimationFrame(loop);
  if (now - lastDraw < 33) return;                        // ~30 fps
  lastDraw = now;
  if (started && !playing) tryStart();
  const time = started ? Math.max(0, now - pressT)/1000 + START : START;
  const u = ((time % dur) + dur) % dur / dur;
  if (an && playing) { an.getByteFrequencyData(fd); let s = 0; for (let i = 0; i < 8; i++) s += fd[i]; energy += (s/8/255 - energy)*.35; } else energy = .12 + .08*Math.sin(time*2);
  px += (tpx - px)*.06; py += (tpy - py)*.06;
  renderScene(u, time);
  toAscii();
}
requestAnimationFrame(loop);
</script>
